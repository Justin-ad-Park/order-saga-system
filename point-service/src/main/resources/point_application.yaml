# src/main/resources/application.yml
spring:
  profiles:
    active: test

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:mysql://localhost:3307/point_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: point_user
    password: point_pw

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:point_schema.sql
  #    init:
  #      mode: embedded  #always | never | embedded

server:
  port: 8082

circuit-test:
  point:
    delay-prefix: PNT-INT-CIRCUIT-ON
    delay-ms: 8000

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://mysql.msa.svc.cluster.local:3306/point_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: point_user
    password: ${POINT_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:point_schema.sql
  #    init:
  #      mode: embedded  #always | never | embedded

server:
  port: 8082

circuit-test:
  point:
    delay-prefix: PNT-INT-CIRCUIT-ON
    delay-ms: 8000

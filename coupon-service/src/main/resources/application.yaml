# src/main/resources/application.yml
spring:
  profiles:
    active: test

---
spring:
  config:
    activate:
      on-profile: test
  application:
    name: coupon-service

  datasource:
    url: jdbc:h2:mem:coupondb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  #    init:
  #      mode: embedded  #always | never | embedded
  h2:
    console:
      enabled: true  # http://localhost:8081/h2-console
      path: /h2-console

server:
  port: 8081

persistence:
  type: h2

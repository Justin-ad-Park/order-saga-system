# src/main/resources/application.yml
spring:
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  application:
    name: coupon-service

  datasource:
    url: jdbc:h2:mem:coupondb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    hibernate:
      ddl-auto: update
    show-sql: true
  #    init:
  #      mode: embedded  #always | never | embedded
  h2:
    console:
      enabled: true  # http://localhost:8080/h2-console
      path: /h2-console

server:
  port: 8081

persistence:
  type: h2
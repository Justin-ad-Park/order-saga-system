# src/main/resources/application.yml
spring:
  profiles:
    active: test

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:mysql://localhost:3307/coupon_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: coupon_user
    password: coupon_pw

    #url: jdbc:h2:mem:coupon;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    #url: "jdbc:h2:tcp://localhost:9092/${user.home}/test/coupon-test;MODE=LEGACY;AUTO_SERVER=TRUE;AUTO_SERVER_PORT=9092"
    #driver-class-name: org.h2.Driver
    #username: sa
    #password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:coupon_schema.sql
  #    init:
  #      mode: embedded  #always | never | embedded
  h2:
    console:
      enabled: true  # http://localhost:8081/h2-console
      path: /h2-console

server:
  port: 8081

persistence:
  type: h2

---
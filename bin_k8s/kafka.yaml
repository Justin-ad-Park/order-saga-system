apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: msa
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
    - name: external
      port: 9094
      targetPort: 9094

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: msa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
            - containerPort: 9094
          env:
            - name: KAFKA_CLUSTER_ID
              value: "fhqbRm3XSFiwYlvFP9MIyA"
          command:
            - /bin/bash
            - -lc
            - |
              set -e
              cat > /tmp/kraft.properties <<'EOF'
              process.roles=broker,controller
              node.id=1
              controller.quorum.voters=1@kafka:9093
              listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
              advertised.listeners=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
              inter.broker.listener.name=PLAINTEXT
              controller.listener.names=CONTROLLER
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
              log.dirs=/var/lib/kafka/data
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
              transaction.state.log.min.isr=1
              group.initial.rebalance.delay.ms=0
              num.partitions=1
              EOF
              /opt/kafka/bin/kafka-storage.sh format -t "${KAFKA_CLUSTER_ID}" -c /tmp/kraft.properties --ignore-formatted
              exec /opt/kafka/bin/kafka-server-start.sh /tmp/kraft.properties
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: kafka-data
          emptyDir: {}
